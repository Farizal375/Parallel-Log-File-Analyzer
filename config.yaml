  npm: "247006111044"

dataset:
  nama: "Web Server Access Logs"                                   # 👤 informasi saja, ubah jika dataset berbeda
  sumber_url: "https://www.kaggle.com/datasets/eliasdabbas/web-server-access-logs"  # 👤 informasi saja (untuk laporan)
  raw_dir: "dataset/raw"
  prepared_dir: "dataset/prepared"
  file_sizes_mb: [50, 100, 200]            # variasi ukuran file

experiment:
  file_counts: [4, 8, 16, 32]                # TAMBAHAN: variasi jumlah file
